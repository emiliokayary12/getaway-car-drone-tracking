services:
  sitl:
    build:
      context: .
      dockerfile: docker/Dockerfile.sitl
    container_name: getaway-sitl
    network_mode: host
    environment:
      - HOME=/root
    command: >
      bash -lc "
      sim_vehicle.py
      -v ArduCopter
      -f gazebo-iris
      --model JSON
      --map --console
      -l -35.363261,149.165230,584,0
      --out=udp:127.0.0.1:14550
      --out=udp:127.0.0.1:14551
      --no-rebuild
      "
    stdin_open: true
    tty: true

  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    container_name: getaway-sim
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,display
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
      - LIBGL_ALWAYS_INDIRECT=0
      - GZ_SIM_RESOURCE_PATH=/sim/gazebo/models:/sim/gazebo/worlds:/root/gz_ws/src/ardupilot_gazebo/models
      - GZ_SIM_SYSTEM_PLUGIN_PATH=/root/gz_ws/install/ardupilot_gazebo/lib
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./gazebo:/sim/gazebo:rw
      - ./scripts:/sim/scripts:rw
      - ./models:/sim/models:rw
    depends_on:
      - sitl
    stdin_open: true
    tty: true
    command: bash /sim/scripts/entry_sim.sh
